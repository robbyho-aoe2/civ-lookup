<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Insights — AoE Auto Scout</title>
<style>
:root{
  --bg:#0f0d0b;--surf:#1c1814;--surf2:#242018;--border:#332c24;--border2:#4a3f30;
  --amber:#c8922a;--amberL:#f0b458;--amberBg:rgba(200,146,42,.1);
  --text:#ede5d8;--text2:#a8967e;--text3:#6b5840;
  --green:#4ade80;--greenBg:rgba(74,222,128,.07);--greenBd:rgba(74,222,128,.25);
  --red:#f87171;--redBg:rgba(248,113,113,.07);--redBd:rgba(248,113,113,.25);
  --radius:8px;
  /* bracket palette — same coding as the rest of the site's console
     breakdowns: Low/Lo-Mid/Hi-Mid/High, low-to-high rating */
  --b-low:#c98500;--b-lomid:#199e70;--b-himid:#d95926;--b-high:#3987e5;
  /* ghost/play-intensity bars use each bracket's complementary color,
     not a tint of its own — see console_elo_distribution artifact */
  --g-low:#9085e9;--g-lomid:#e66767;--g-himid:#3987e5;--g-high:#d95926;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px;}

header{display:flex;align-items:center;gap:14px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border);}
header h1{font-size:20px;margin:0;}
header .back{font-size:13px;color:var(--text2);text-decoration:none;}
header .back:hover{color:var(--amberL);}
.subtitle{font-size:13px;color:var(--text2);margin:2px 0 0;}
.page-tabs{display:flex;gap:6px;margin:0 0 22px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.page-tabs a{padding:10px 16px;font-size:13px;font-weight:600;color:var(--text2);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
.page-tabs a:hover{color:var(--text);}
.page-tabs a.on{color:var(--amberL);border-bottom-color:var(--amber);}

.card{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:22px 22px 18px;margin-bottom:22px;}
.card h2{font-size:15px;margin:0 0 4px;color:var(--amberL);}
.card .desc{font-size:12px;color:var(--text2);margin:0 0 18px;}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-bottom:20px;}
.stat-tile{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;}
.stat-tile .label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:4px;}
.stat-tile .value{font-size:19px;font-weight:700;color:var(--text);}

.chart-legend{display:flex;gap:16px;align-items:center;margin-bottom:10px;font-size:12px;color:var(--text2);flex-wrap:wrap;}
.chart-legend-item{display:flex;align-items:center;gap:6px;}
.legend-swatch-solid{width:12px;height:12px;border-radius:3px;background:var(--text2);flex-shrink:0;}
.legend-swatch-ghost{width:12px;height:12px;border-radius:3px;background:var(--text2);opacity:.6;flex-shrink:0;}

.chart-wrap{position:relative;}
svg{display:block;width:100%;height:auto;overflow:visible;}
.gridline{stroke:var(--border);stroke-width:1;}
.baseline{stroke:var(--border2);stroke-width:1;}
.bracket-guide{stroke:var(--text3);stroke-width:1;stroke-dasharray:2 3;opacity:.5;}
.bar{cursor:pointer;}
.bar:hover{opacity:.85;}
.hit-area{fill:transparent;cursor:pointer;}
.ghost-bar{pointer-events:none;opacity:.65;}
.bar-low{fill:var(--b-low);background-color:var(--b-low);}
.bar-lomid{fill:var(--b-lomid);background-color:var(--b-lomid);}
.bar-himid{fill:var(--b-himid);background-color:var(--b-himid);}
.bar-high{fill:var(--b-high);background-color:var(--b-high);}
.ghost-low{fill:var(--g-low);background-color:var(--g-low);}
.ghost-lomid{fill:var(--g-lomid);background-color:var(--g-lomid);}
.ghost-himid{fill:var(--g-himid);background-color:var(--g-himid);}
.ghost-high{fill:var(--g-high);background-color:var(--g-high);}
.tick-label{fill:var(--text3);font-size:10px;}
.axis-label{fill:var(--text2);font-size:11px;}
.median-line{stroke:var(--text2);stroke-width:1.5;stroke-dasharray:3 3;}
.median-label{fill:var(--text2);font-size:10px;font-weight:600;}

.tooltip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:6px;transform:translate(-50%,-100%);white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5;}
.tooltip.show{opacity:1;}
.tooltip .row1{font-weight:700;}
.tooltip .row2,.tooltip .row3{color:var(--text2);}

.brackets{margin-top:22px;}
.brackets-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:8px;}
.bracket-track{display:flex;height:28px;border-radius:6px;overflow:hidden;gap:2px;}
.bracket-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;min-width:0;}
.bracket-legend{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;}
.bracket-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);}
.bracket-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.swatch-pair{display:inline-flex;gap:2px;}

.ratio-rows{display:flex;flex-direction:column;gap:14px;}
.ratio-row{display:grid;grid-template-columns:120px 1fr 90px;align-items:center;gap:12px;}
.ratio-name{font-size:13px;font-weight:600;}
.ratio-sub{font-size:11px;color:var(--text3);font-weight:400;}
.ratio-track{position:relative;height:22px;background:var(--bg);border:1px solid var(--border);border-radius:6px;overflow:visible;}
.ratio-fill{position:absolute;top:0;bottom:0;left:0;border-radius:6px;display:flex;align-items:center;}
.ratio-refline{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text2);}
.ratio-refline::after{content:'1.0x';position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--text3);white-space:nowrap;}
.ratio-value{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}

details.table-toggle{margin-top:20px;}
summary{cursor:pointer;font-size:12px;color:var(--text2);user-select:none;}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;}
th{color:var(--text3);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.04em;}
th.num,td.num{text-align:center;}

.loading,.error{font-size:13px;color:var(--text2);padding:20px;text-align:center;}
.error{color:var(--red);}

.insights-nav{position:sticky;top:0;z-index:10;display:flex;gap:6px;flex-wrap:wrap;background:var(--bg);padding:10px 0 16px;margin-bottom:6px;border-bottom:1px solid var(--border);}
.insights-nav a{font-size:12px;font-weight:600;color:var(--text2);text-decoration:none;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surf);white-space:nowrap;}
.insights-nav a:hover{color:var(--amberL);border-color:var(--amber);}

.civ-table-wrap{overflow-x:auto;}
.civ-table{min-width:640px;}
#cvp-table{min-width:unset;width:100%;margin-top:10px;}
#cvp-table th,#cvp-table td{padding:5px 2px;font-size:12px;}
.civ-table th.civ-col,.civ-table td.civ-col{position:sticky;left:0;background:var(--surf);}
.civ-table th{cursor:pointer;user-select:none;white-space:nowrap;}
.civ-table th:hover{color:var(--amberL);}
.civ-table th.sorted::after{content:' ▾';color:var(--amber);}
.civ-table th.sorted.asc::after{content:' ▴';}
.wr-cell{font-variant-numeric:tabular-nums;}
.wr-good{color:var(--green);}
.wr-bad{color:var(--red);}
.pr-sub{color:var(--text3);font-size:10px;}
.low-sample{opacity:.45;}
.civ-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.civ-ladder-toggle{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
#weekly-archive-select{background:var(--surf);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;font-size:12px;font-weight:600;margin-bottom:14px;font-family:inherit;}
.weekly-section{margin-top:20px;}
.weekly-section:first-child{margin-top:0;}
.weekly-section h3{font-size:14px;margin:0 0 4px;color:var(--text);}
.weekly-section .sub-desc{font-size:11px;color:var(--text3);margin:0 0 8px;}
.weekly-empty{font-size:12px;color:var(--text3);font-style:italic;}
.updated-label{display:block;font-size:10px;color:var(--text3);margin-top:2px;}
.weekly-highlight{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;font-size:13px;}
.weekly-highlight b{color:var(--amberL);}
.civ-ladder-toggle button{background:none;border:none;padding:7px 12px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;}
.civ-ladder-toggle button.on{background:var(--amber);color:#1a0a00;}
.civ-search{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;color:var(--text);font-size:12px;outline:none;width:160px;}
.civ-search:focus{border-color:var(--amber);}
.civ-legend{font-size:11px;color:var(--text3);}
.pr-toggle{background:none;border:1px solid var(--border2);border-radius:10px;color:var(--text3);font-size:9px;font-weight:700;padding:1px 5px;margin-left:5px;cursor:pointer;letter-spacing:.03em;}
.pr-toggle:hover{color:var(--amberL);border-color:var(--amber);}
.pr-toggle.on{background:var(--amberBg);color:var(--amberL);border-color:var(--amber);}

.peak-rows{display:flex;flex-direction:column;gap:9px;}
.peak-row{display:grid;grid-template-columns:150px 1fr 108px;align-items:center;gap:12px;}
.peak-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.peak-name a,#crossplay-table td a,#squad-table td a,.weekly-section td a,.weekly-highlight a{color:inherit;text-decoration:none;}
.peak-name a:hover,#crossplay-table td a:hover,#squad-table td a:hover,.weekly-section td a:hover,.weekly-highlight a:hover{color:var(--amberL);text-decoration:underline;}
.peak-rank{color:var(--text3);font-weight:400;margin-right:4px;}
.peak-track{position:relative;height:18px;background:var(--bg);border:1px solid var(--border);border-radius:5px;overflow:hidden;}
.peak-fill-ceiling{position:absolute;top:0;bottom:0;left:0;background:var(--border2);border-radius:5px;}
.peak-fill-current{position:absolute;top:0;bottom:0;left:0;background:var(--amber);border-radius:5px;}
.peak-value{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;}
.peak-value .peak-num{font-weight:700;color:var(--amberL);}
.peak-value .cur-sub{font-size:10px;color:var(--text3);display:block;}
.peak-legend{display:flex;gap:16px;align-items:center;margin-bottom:14px;font-size:12px;color:var(--text2);flex-wrap:wrap;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>📊 Insights</h1>
    </div>
  </header>

  <nav class="page-tabs">
    <a href="index.html">🏠 Auto Scout</a>
    <a href="insights.html" class="on">📊 Insights</a>
    <a href="build-order.html">🛠️ Build Order</a>
  </nav>

  <nav class="insights-nav">
    <a href="#weekly">📅 Weekly Recap</a>
    <a href="#distribution">Rating Distribution</a>
    <a href="#intensity">Play Intensity</a>
    <a href="#civs">Civ Leaderboard</a>
    <a href="#crossplay">Crossplay Ceiling</a>
    <a href="#squads">Top Squads</a>
    <a href="#console-vs-pc">Console vs PC</a>
    <a href="player.html">🔎 Player Spotlight</a>
  </nav>

  <div id="content">
    <div class="loading">Loading player data…</div>
  </div>
</div>

<script>
const PLAYER_DATA_BASE = 'https://raw.githubusercontent.com/robbyho-aoe2/player-data/main/data';
const AGGREGATE_META_URL = `${PLAYER_DATA_BASE}/aggregate-meta.json`;
const CONSOLE_CIVS_URL = `${PLAYER_DATA_BASE}/insights-console-civs.json`;
const CONSOLE_SQUADS_URL = `${PLAYER_DATA_BASE}/insights-console-squads.json`;
const WEEKLY_INDEX_URL = `${PLAYER_DATA_BASE}/weekly-reports/index.json`;
const weeklyReportUrl = date => `${PLAYER_DATA_BASE}/weekly-reports/console-${date}.json`;
const svgNS = 'http://www.w3.org/2000/svg';

const brackets = [
  { key: 'low',   name: 'Low',    range: '0–899',     lo: 0,    hi: 899,   cls: 'bar-low',   ghostCls: 'ghost-low' },
  { key: 'lomid', name: 'Lo-Mid', range: '900–1299',  lo: 900,  hi: 1299,  cls: 'bar-lomid', ghostCls: 'ghost-lomid' },
  { key: 'himid', name: 'Hi-Mid', range: '1300–1699', lo: 1300, hi: 1699,  cls: 'bar-himid', ghostCls: 'ghost-himid' },
  { key: 'high',  name: 'High',   range: '1700+',     lo: 1700, hi: 99999, cls: 'bar-high',  ghostCls: 'ghost-high' },
];
function bracketFor(rating) { return brackets.find(b => rating >= b.lo && rating <= b.hi); }

// Same recency-weighting as index.html's Form mode: exponential decay,
// 90-day half-life, computed against "today" so it stays live rather than
// frozen as of the last data pull.
const RECENT_FORM_HALF_LIFE_DAYS = 90;
function recentFormWeight(weekStr) {
  const gameDate = new Date(weekStr + 'T00:00:00Z');
  const daysAgo = Math.max(0, (Date.now() - gameDate.getTime()) / 86400000);
  return Math.pow(0.5, daysAgo / RECENT_FORM_HALF_LIFE_DAYS);
}
function weightedStatsFromByWeek(byWeek, minGames) {
  const totals = {};
  Object.entries(byWeek || {}).forEach(([week, civs]) => {
    const w = recentFormWeight(week);
    Object.entries(civs).forEach(([civ, e]) => {
      if (!totals[civ]) totals[civ] = { games: 0, wg: 0, ww: 0 };
      totals[civ].games += e.games;
      totals[civ].wg += e.games * w;
      totals[civ].ww += e.wins * w;
    });
  });
  const out = {};
  Object.entries(totals).forEach(([civ, t]) => {
    if (t.games < minGames) return;
    out[civ] = { wr: t.wg > 0 ? (t.ww / t.wg * 100) : 0, games: t.games };
  });
  return out;
}

// Same crest source as index.html — narrow icon instead of a text name
// so per-civ tables stay compact enough to fit a mobile screen width.
const CIV_ICON_BASE = 'https://raw.githubusercontent.com/SiegeEngineers/aoe2techtree/master/img/Civs';
const CIV_ICON_FILE_OVERRIDES = { Maya: 'mayans' };
function civIconUrl(civName) {
  const file = CIV_ICON_FILE_OVERRIDES[civName] || civName.toLowerCase();
  return `${CIV_ICON_BASE}/${file}.png`;
}
function abbrevGames(n) {
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
  return String(n);
}

// build_aggregate.py writes lastUpdated as a full ISO 8601 UTC timestamp;
// tolerate the older bare-date ('YYYY-MM-DD') format too since a page
// load right after a rollout could still see it on a not-yet-rebuilt file.
function formatUpdatedAt(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const hasTime = iso.includes('T');
  const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  if (!hasTime) return dateStr;
  const timeStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'UTC', timeZoneName: 'short' });
  return `${dateStr}, ${timeStr}`;
}
function updatedLabel(iso) {
  const formatted = formatUpdatedAt(iso);
  return formatted ? `<span class="updated-label">Updated ${formatted}</span>` : '';
}

async function loadAndRender() {
  const content = document.getElementById('content');
  try {
    const [metaRes, civsRes, squadsRes] = await Promise.all([
      fetch(`${AGGREGATE_META_URL}?t=${Date.now()}`, { cache: 'no-store' }),
      fetch(`${CONSOLE_CIVS_URL}?t=${Date.now()}`, { cache: 'no-store' }),
      fetch(`${CONSOLE_SQUADS_URL}?t=${Date.now()}`, { cache: 'no-store' }),
    ]);
    if (!metaRes.ok) throw new Error('HTTP ' + metaRes.status);
    if (!civsRes.ok) throw new Error('HTTP ' + civsRes.status);
    const meta = await metaRes.json();
    const civsData = await civsRes.json();
    const squadsData = squadsRes.ok ? await squadsRes.json() : { duos: [], trios: [], quads: [] };
    const consolePlayers = (meta.players || []).filter(p => p.group === 'console');
    const rated = consolePlayers.filter(p => p.ratings && p.ratings['1v1 Console'] != null);

    const binSize = 100;
    const bins = {};
    rated.forEach(p => {
      const r = p.ratings['1v1 Console'];
      const b = Math.floor(r / binSize) * binSize;
      if (!bins[b]) bins[b] = { players: 0, games: 0 };
      bins[b].players += 1;
      bins[b].games += (p.totalGames || 0);
    });

    const binEntries = Object.entries(bins).map(([k, v]) => [+k, v.players, v.games]).sort((a, b) => a[0] - b[0]);
    const ratings = rated.map(p => p.ratings['1v1 Console']).sort((a, b) => a - b);
    const pct = p => ratings[Math.min(ratings.length - 1, Math.floor(p * ratings.length))];
    const totalGames = rated.reduce((s, p) => s + (p.totalGames || 0), 0);
    const stats = {
      total: consolePlayers.length, withRating: rated.length,
      min: ratings[0], max: ratings[ratings.length - 1],
      mean: Math.round(ratings.reduce((a, b) => a + b, 0) / ratings.length),
      median: pct(0.5), p90: pct(0.9), totalGames,
    };

    const bracketAgg = {};
    brackets.forEach(b => {
      let players = 0, games = 0;
      binEntries.forEach(([bin, p, g]) => { if (bin >= b.lo && bin <= b.hi) { players += p; games += g; } });
      bracketAgg[b.key] = { players, games };
    });

    // Curated cleanup for the Crossplay Ceiling insight specifically — a
    // few tracked accounts turned out to be the same real person under a
    // second profileId (smurf/alt), or otherwise didn't belong. Scoped to
    // just this insight rather than reclassifying the accounts site-wide,
    // since that's a display-quality call for this one leaderboard, not a
    // group/tracking change.
    const CROSSPLAY_EXCLUDE_IDS = new Set([
      13175835, // xXDeltaXFadesXx
      12868111, // MORIS0202
      106515,   // The Enfo4387 — reclassified console->pc in player-data;
                // kept here too so this insight updates immediately
                // instead of waiting on the next aggregate rebuild.
    ]);
    const CROSSPLAY_DEDUP_PAIRS = [
      [20168942, 12798178], // Combi I Chow vs DS Chowde
      [20945272, 13379095], // Steve Irwin6443 vs ObelusCipher
      [23790720, 12760988], // Dolphinjack7648 vs Shadow8373
      [23477132, 25840006], // ItsGutsAoE vs LordSnowAoE
      [22759370, 24074346], // BillieDown vs BillieDownn
    ];
    const crossplayDropIds = new Set(CROSSPLAY_EXCLUDE_IDS);
    CROSSPLAY_DEDUP_PAIRS.forEach(([idA, idB]) => {
      const a = consolePlayers.find(p => p.profileId === idA);
      const b = consolePlayers.find(p => p.profileId === idB);
      const peakA = a?.peaks?.['1v1 PC']?.peak ?? -1;
      const peakB = b?.peaks?.['1v1 PC']?.peak ?? -1;
      crossplayDropIds.add(peakA >= peakB ? idB : idA);
    });

    const crossplayRows = consolePlayers
      .filter(p => p.peaks && p.peaks['1v1 PC'] && p.peaks['1v1 PC'].peak != null)
      .filter(p => !crossplayDropIds.has(p.profileId))
      .map(p => ({
        name: p.name,
        profileId: p.profileId,
        peak: p.peaks['1v1 PC'].peak,
        current: p.peaks['1v1 PC'].current ?? p.peaks['1v1 PC'].peak,
      }))
      .sort((a, b) => b.peak - a.peak);

    const nameOf = {};
    (meta.players || []).forEach(p => { nameOf[p.profileId] = p.name; });
    const namesFor = ids => ids.map(id => nameOf[id] || `player_${id}`);
    const squadRowsFor = list => (list || [])
      .map(r => ({ names: namesFor(r.profileIds), profileIds: r.profileIds, games: r.games, wins: r.wins, winRate: r.games ? r.wins / r.games : 0 }));
    const squadScope = s => ({
      duos: squadRowsFor(s?.duos),
      trios: squadRowsFor(s?.trios),
      quads: squadRowsFor(s?.quads),
    });
    const squads = {
      all: squadScope(squadsData.all),
      console: squadScope(squadsData.console),
      pc: squadScope(squadsData.pc),
    };

    render(content, binEntries, stats, bracketAgg, civsData, crossplayRows, squads, meta.lastUpdated, squadsData.lastUpdated);
  } catch (e) {
    content.innerHTML = `<div class="error">Could not load player data: ${e.message}</div>`;
  }
}

function render(content, binEntries, stats, bracketAgg, civsData, crossplayRows, squads, metaLastUpdated, squadsLastUpdated) {
  content.innerHTML = `
    <section id="weekly" class="card">
      <h2>Weekly Recap</h2>
      <p class="desc" id="weekly-desc">What happened in the console scene this week.</p>
      <select id="weekly-archive-select" style="display:none"></select>
      <div id="weekly-content"><div class="loading">Loading weekly recap…</div></div>
    </section>

    <section id="distribution" class="card">
      <h2>Console Players — Rating Distribution</h2>
      <p class="desc">${stats.withRating.toLocaleString()} rated players (of ${stats.total.toLocaleString()} tracked) · 1v1 Console rating, live from the latest backfill${updatedLabel(metaLastUpdated)}</p>
      <div class="stat-row" id="stat-row"></div>

      <h2>Top Squads — Console Team Games</h2>
      <p class="desc">Tracked console players who repeatedly queue together as teammates on Team ladder games. Detection only sees teammates we already track, so this fills in as more players get backfilled — a real duo where one side isn't tracked yet won't show up until they are.${updatedLabel(squadsLastUpdated)}</p>
      <div class="civ-controls">

    <section id="console-vs-pc" class="card">
      <h2>Console Arabia vs. PC Overall — Biggest Discrepancies</h2>
      <p class="desc">Recency-weighted (90-day half-life, same as Form mode elsewhere) win rate for 1v1 Console on Arabia specifically vs. 1v1 PC overall across all maps — civs that swing hardest between the two, sorted by |difference|. A large negative gap usually means a civ that rewards precise micro/APM; positive means a simpler, bonus-driven civ that holds up better without it.${updatedLabel(civsData.lastUpdated)}</p>
      <div class="civ-table-wrap"><table class="civ-table" id="cvp-table"></table></div>
    </section>
  `;

  // ---- stat tiles ----
  const statRow = document.getElementById('stat-row');
  [['Median', stats.median], ['Mean', stats.mean], ['Min', stats.min], ['Max', stats.max], ['Total games', stats.totalGames]]
    .forEach(([label, value]) => {
      const el = document.createElement('div');
      el.className = 'stat-tile';
      el.innerHTML = `<div class="label">${label}</div><div class="value">${value.toLocaleString()}</div>`;
      statRow.appendChild(el);
    });

  // ---- histogram + ghost bars ----
  const svg = document.getElementById('chart');
  const tooltip = document.getElementById('tooltip');
  const wrap = document.querySelector('.chart-wrap');
  const W = 820, H = 320;
  const marginL = 40, marginR = 58, marginT = 10, marginB = 34;
  const plotW = W - marginL - marginR;
  const plotH = H - marginT - marginB;
  const DOMAIN_MIN = binEntries[0][0];
  const DOMAIN_MAX = binEntries[binEntries.length - 1][0] + 100;
  const binW = plotW / binEntries.length;

  function xForRating(r) {
    const clamped = Math.min(Math.max(r, DOMAIN_MIN), DOMAIN_MAX);
    return marginL + (clamped - DOMAIN_MIN) / (DOMAIN_MAX - DOMAIN_MIN) * plotW;
  }
  // Picks a "nice" tick step (1/2/5 x a power of ten) for a given max
  // value and target tick count — same approach as D3's tick algorithm.
  function niceStep(maxVal, targetSteps) {
    const roughStep = maxVal / targetSteps;
    const mag = Math.pow(10, Math.floor(Math.log10(roughStep || 1)));
    const norm = roughStep / mag;
    const niceNorm = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
    return niceNorm * mag;
  }
  const maxCount = Math.max(...binEntries.map(([, p]) => p));
  const maxGames = Math.max(...binEntries.map(([, , g]) => g));
  const yMax = Math.ceil(maxCount / 50) * 50;
  const gamesStep = niceStep(maxGames, 4);
  const yGamesMax = Math.ceil(maxGames / gamesStep) * gamesStep;
  function y(v) { return marginT + plotH - (v / yMax) * plotH; }
  function yGhost(v) { return marginT + plotH - (v / yGamesMax) * plotH; }

  const ySteps = 4;
  for (let i = 0; i <= ySteps; i++) {
    const val = Math.round((yMax / ySteps) * i);
    const yy = y(val);
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', marginL); line.setAttribute('x2', W - marginR);
    line.setAttribute('y1', yy); line.setAttribute('y2', yy);
    line.setAttribute('class', i === 0 ? 'baseline' : 'gridline');
    svg.appendChild(line);
    const label = document.createElementNS(svgNS, 'text');
    label.setAttribute('x', marginL - 8); label.setAttribute('y', yy + 3);
    label.setAttribute('text-anchor', 'end'); label.setAttribute('class', 'tick-label');
    label.textContent = val.toLocaleString();
    svg.appendChild(label);
  }

  // Right axis — games played. No gridlines of its own (would conflict
  // with the left axis's spacing); ticks sit at clean round numbers on
  // the games scale, using the same complementary-color styling as the
  // ghost bars so it's visually tied to what it's labeling.
  for (let v = 0; v <= yGamesMax; v += gamesStep) {
    const yy = yGhost(v);
    const label = document.createElementNS(svgNS, 'text');
    label.setAttribute('x', W - marginR + 8); label.setAttribute('y', yy + 3);
    label.setAttribute('text-anchor', 'start'); label.setAttribute('class', 'tick-label');
    label.textContent = v.toLocaleString();
    svg.appendChild(label);
  }
  const rightAxisLabel = document.createElementNS(svgNS, 'text');
  rightAxisLabel.setAttribute('x', W - 6);
  rightAxisLabel.setAttribute('y', marginT - 2);
  rightAxisLabel.setAttribute('text-anchor', 'end');
  rightAxisLabel.setAttribute('class', 'axis-label');
  rightAxisLabel.textContent = 'Games played';
  svg.appendChild(rightAxisLabel);

  [900, 1300, 1700].forEach(r => {
    const gx = xForRating(r);
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', gx); line.setAttribute('x2', gx);
    line.setAttribute('y1', marginT); line.setAttribute('y2', marginT + plotH);
    line.setAttribute('class', 'bracket-guide');
    svg.appendChild(line);
  });

  const gap = 2;
  binEntries.forEach(([bin, count, games]) => {
    const i = (bin - DOMAIN_MIN) / 100;
    const x = marginL + i * binW;
    const bracket = bracketFor(bin);

    const ghostW = binW - gap;
    const ghost = document.createElementNS(svgNS, 'rect');
    ghost.setAttribute('x', x);
    ghost.setAttribute('y', yGhost(games));
    ghost.setAttribute('width', Math.max(ghostW, 1));
    ghost.setAttribute('height', Math.min(Math.max((games / yGamesMax) * plotH, 0), plotH));
    ghost.setAttribute('rx', 4);
    ghost.setAttribute('class', `ghost-bar ${bracket.ghostCls}`);
    svg.appendChild(ghost);

    const barW = ghostW * 0.55;
    const bar = document.createElementNS(svgNS, 'rect');
    bar.setAttribute('x', x + (ghostW - barW) / 2);
    bar.setAttribute('y', y(count));
    bar.setAttribute('width', Math.max(barW, 1));
    bar.setAttribute('height', Math.max((count / yMax) * plotH, 0));
    bar.setAttribute('rx', 3);
    bar.setAttribute('class', `bar ${bracket.cls}`);
    svg.appendChild(bar);

    const hit = document.createElementNS(svgNS, 'rect');
    hit.setAttribute('x', x); hit.setAttribute('y', marginT);
    hit.setAttribute('width', Math.max(ghostW, 1)); hit.setAttribute('height', plotH);
    hit.setAttribute('class', 'hit-area');
    hit.addEventListener('mousemove', (e) => {
      const rectBox = wrap.getBoundingClientRect();
      tooltip.style.left = (e.clientX - rectBox.left) + 'px';
      tooltip.style.top = (e.clientY - rectBox.top - 10) + 'px';
      const avgGames = count ? Math.round(games / count) : 0;
      tooltip.innerHTML = `<div class="row1">${bin}–${bin + 99} rating</div><div class="row2">${count.toLocaleString()} player${count === 1 ? '' : 's'} · ${bracket.name}</div><div class="row3">${games.toLocaleString()} games played (~${avgGames.toLocaleString()}/player)</div>`;
      tooltip.classList.add('show');
    });
    hit.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
    svg.appendChild(hit);

    if (i % 2 === 0) {
      const tick = document.createElementNS(svgNS, 'text');
      tick.setAttribute('x', x + ghostW / 2);
      tick.setAttribute('y', H - marginB + 16);
      tick.setAttribute('text-anchor', 'middle');
      tick.setAttribute('class', 'tick-label');
      tick.textContent = bin;
      svg.appendChild(tick);
    }
  });

  const axisLabel = document.createElementNS(svgNS, 'text');
  axisLabel.setAttribute('x', marginL + plotW / 2);
  axisLabel.setAttribute('y', H - 2);
  axisLabel.setAttribute('text-anchor', 'middle');
  axisLabel.setAttribute('class', 'axis-label');
  axisLabel.textContent = '1v1 Console rating';
  svg.appendChild(axisLabel);

  const mX = xForRating(stats.median);
  const mLine = document.createElementNS(svgNS, 'line');
  mLine.setAttribute('x1', mX); mLine.setAttribute('x2', mX);
  mLine.setAttribute('y1', marginT); mLine.setAttribute('y2', marginT + plotH);
  mLine.setAttribute('class', 'median-line');
  svg.appendChild(mLine);
  const mLabel = document.createElementNS(svgNS, 'text');
  mLabel.setAttribute('x', mX + 6); mLabel.setAttribute('y', marginT + 12);
  mLabel.setAttribute('class', 'median-label');
  mLabel.textContent = `median ${stats.median}`;
  svg.appendChild(mLabel);

  // ---- bracket track ----
  const trackEl = document.getElementById('bracket-track');
  const legendEl = document.getElementById('bracket-legend');
  const bracketTotal = Object.values(bracketAgg).reduce((a, b) => a + b.players, 0);
  brackets.forEach(b => {
    const { players, games } = bracketAgg[b.key];
    const widthPct = (players / bracketTotal) * 100;
    const seg = document.createElement('div');
    seg.className = `bracket-seg ${b.cls}`;
    seg.style.width = widthPct + '%';
    seg.textContent = widthPct >= 8 ? `${Math.round(widthPct)}%` : '';
    seg.title = `${b.name} (${b.range}): ${players.toLocaleString()} players`;
    trackEl.appendChild(seg);

    const item = document.createElement('div');
    item.className = 'bracket-legend-item';
    item.innerHTML = `<span class="swatch-pair"><span class="bracket-swatch ${b.cls}"></span><span class="bracket-swatch ${b.ghostCls}"></span></span>${b.name} (${b.range}) — ${players.toLocaleString()}`;
    legendEl.appendChild(item);
  });

  // ---- table ----
  const table = document.getElementById('data-table');
  table.innerHTML = '<thead><tr><th>Rating range</th><th>Bracket</th><th class="num">Players</th><th class="num">Games played</th><th class="num">Avg/player</th></tr></thead>' +
    '<tbody>' + binEntries.map(([bin, count, games]) => `<tr><td>${bin}–${bin + 99}</td><td>${bracketFor(bin).name}</td><td class="num">${count.toLocaleString()}</td><td class="num">${games.toLocaleString()}</td><td class="num">${(count ? Math.round(games / count) : 0).toLocaleString()}</td></tr>`).join('') + '</tbody>';

  // ---- play intensity ----
  const totalPlayers = Object.values(bracketAgg).reduce((a, b) => a + b.players, 0);
  const weeklyGamesByBracket = civsData.weeklyGamesByBracket || {};

  function gamesForRange(bracketKey, range) {
    if (range === 'all') return bracketAgg[bracketKey].games;
    const weeks = weeklyGamesByBracket[bracketKey] || {};
    let cutoff;
    if (range === 'year') cutoff = `${new Date().getFullYear()}-01-01`;
    else cutoff = new Date(Date.now() - 90 * 86400000).toISOString().slice(0, 10);
    return Object.entries(weeks).reduce((sum, [week, g]) => sum + (week >= cutoff ? g : 0), 0);
  }

  function renderIntensity(range) {
    const gamesByBracket = {};
    brackets.forEach(b => { gamesByBracket[b.key] = gamesForRange(b.key, range); });
    const totalGamesRange = Object.values(gamesByBracket).reduce((a, b) => a + b, 0);

    const ratios = brackets.map(b => {
      const { players } = bracketAgg[b.key];
      const games = gamesByBracket[b.key];
      const playerShare = players / totalPlayers;
      const gameShare = totalGamesRange ? games / totalGamesRange : 0;
      return { ...b, players, games, playerShare, gameShare, ratio: playerShare ? gameShare / playerShare : 0, avgPerPlayer: players ? Math.round(games / players) : 0 };
    });
    const maxRatio = Math.max(...ratios.map(r => r.ratio), 1);
    const rowsEl = document.getElementById('ratio-rows');
    rowsEl.innerHTML = '';
    ratios.forEach(r => {
      const row = document.createElement('div');
      row.className = 'ratio-row';
      const fillPct = (r.ratio / maxRatio) * 100;
      const refPct = (1 / maxRatio) * 100;
      row.innerHTML = `
        <div class="ratio-name">${r.name}<div class="ratio-sub">${(r.playerShare * 100).toFixed(1)}% of players</div></div>
        <div class="ratio-track">
          <div class="ratio-fill ${r.cls}" style="width:${fillPct}%"></div>
          <div class="ratio-refline" style="left:${refPct}%"></div>
        </div>
        <div class="ratio-value">${r.ratio.toFixed(2)}x<div class="ratio-sub">${r.avgPerPlayer.toLocaleString()}/player</div></div>
      `;
      rowsEl.appendChild(row);
    });
  }
  renderIntensity('all');
  document.querySelectorAll('#intensity-range-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#intensity-range-toggle button').forEach(b => b.classList.toggle('on', b === btn));
      renderIntensity(btn.dataset.range);
    });
  });

  // ---- civ leaderboard by bracket ----
  const bracketKeys = ['low', 'lomid', 'himid', 'high'];
  const MIN_SAMPLE = 20; // below this, a bracket's win rate is noisy enough to flag rather than trust

  function civSourceFor(ladder) {
    if (ladder === 'all') return { overall: civsData.overall, brackets: civsData.brackets };
    const d = civsData.ladders[ladder];
    return { overall: d.overall, brackets: d.brackets };
  }

  function buildCivRows(ladder) {
    const src = civSourceFor(ladder);
    return Object.keys(civsData.overall).sort().map(name => {
      const row = { name, overall: src.overall[name] || { games: 0, wins: 0, pickRate: 0 } };
      bracketKeys.forEach(k => {
        const d = (src.brackets[k] || {})[name] || { games: 0, wins: 0, pickRate: 0 };
        row[k] = { games: d.games, wins: d.wins, pickRate: d.pickRate, wr: d.games ? d.wins / d.games : null };
      });
      return row;
    });
  }

  let civLadder = 'all';
  let civRows = buildCivRows(civLadder);
  let civSort = { key: 'overall', mode: 'wr', dir: 'desc' };
  let civFilter = '';

  function civSortValue(row, key, mode) {
    if (key === 'name') return row.name;
    if (key === 'overall') return row.overall.games;
    const d = row[key];
    if (mode === 'pr') return d.pickRate || 0;
    if (d.wr == null) return -1;
    // Sufficient-sample entries (>=MIN_SAMPLE) always rank above noisy ones,
    // regardless of a lucky/unlucky small-sample win rate — the +10 offset
    // guarantees that tier separation while still ordering correctly by
    // win rate within each tier.
    return (d.games >= MIN_SAMPLE ? 10 : 0) + d.wr;
  }

  function renderCivTable() {
    const tableEl = document.getElementById('civ-table');
    const rows = civRows
      .filter(r => !civFilter || r.name.toLowerCase().includes(civFilter))
      .slice()
      .sort((a, b) => {
        const av = civSortValue(a, civSort.key, civSort.mode), bv = civSortValue(b, civSort.key, civSort.mode);
        const cmp = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
        return civSort.dir === 'asc' ? cmp : -cmp;
      });

    const cols = [
      { key: 'name', label: 'Civ' },
      { key: 'low', label: 'Low' },
      { key: 'lomid', label: 'Lo-Mid' },
      { key: 'himid', label: 'Hi-Mid' },
      { key: 'high', label: 'High' },
      { key: 'overall', label: 'Games' },
    ];
    const thead = '<thead><tr>' + cols.map(c => {
      const isBracket = bracketKeys.includes(c.key);
      const sorted = civSort.key === c.key && (!isBracket || civSort.mode === 'wr');
      const cls = [c.key === 'name' ? 'civ-col' : '', c.key === 'overall' ? 'num' : '', sorted ? 'sorted' + (civSort.dir === 'asc' ? ' asc' : '') : '']
        .filter(Boolean).join(' ');
      const prOn = isBracket && civSort.key === c.key && civSort.mode === 'pr';
      const prBtn = isBracket ? `<button class="pr-toggle${prOn ? ' on' : ''}" data-pr-key="${c.key}">PR</button>` : '';
      return `<th class="${cls}" data-key="${c.key}">${c.label}${prBtn}</th>`;
    }).join('') + '</tr></thead>';

    const tbody = '<tbody>' + rows.map(r => {
      const cells = bracketKeys.map(k => {
        const d = r[k];
        if (!d.games) return `<td class="wr-cell low-sample">—</td>`;
        const wrPct = (d.wr * 100).toFixed(1);
        const prPct = (d.pickRate * 100).toFixed(1);
        const wrCls = d.wr >= 0.52 ? 'wr-good' : d.wr <= 0.48 ? 'wr-bad' : '';
        const lowSample = d.games < MIN_SAMPLE ? ' low-sample' : '';
        return `<td class="wr-cell${lowSample}"><span class="${wrCls}">${wrPct}%</span><div class="pr-sub">${prPct}% pick · ${d.games.toLocaleString()}g</div></td>`;
      }).join('');
      return `<tr><td class="civ-col">${r.name}</td>${cells}<td class="num">${r.overall.games.toLocaleString()}</td></tr>`;
    }).join('') + '</tbody>';

    tableEl.innerHTML = thead + tbody;
    tableEl.querySelectorAll('th[data-key]').forEach(th => {
      th.addEventListener('click', (e) => {
        if (e.target.closest('.pr-toggle')) return; // handled separately below
        const key = th.dataset.key;
        if (civSort.key === key && civSort.mode === 'wr') civSort.dir = civSort.dir === 'asc' ? 'desc' : 'asc';
        else civSort = { key, mode: 'wr', dir: key === 'name' ? 'asc' : 'desc' };
        renderCivTable();
      });
    });
    tableEl.querySelectorAll('.pr-toggle').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = btn.dataset.prKey;
        if (civSort.key === key && civSort.mode === 'pr') civSort.dir = civSort.dir === 'asc' ? 'desc' : 'asc';
        else civSort = { key, mode: 'pr', dir: 'desc' };
        renderCivTable();
      });
    });
  }
  renderCivTable();

  const civSearchEl = document.getElementById('civ-search');
  civSearchEl.addEventListener('input', () => {
    civFilter = civSearchEl.value.toLowerCase().trim();
    renderCivTable();
  });

  document.querySelectorAll('#civ-ladder-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      civLadder = btn.dataset.ladder;
      document.querySelectorAll('#civ-ladder-toggle button').forEach(b => b.classList.toggle('on', b === btn));
      civRows = buildCivRows(civLadder);
      renderCivTable();
    });
  });

  // ---- crossplay ceiling (console players' peak PC 1v1 rating) ----
  const cpStatRow = document.getElementById('crossplay-stat-row');
  const cpTracked = crossplayRows.length;
  const cpTopPeak = cpTracked ? crossplayRows[0].peak : 0;
  const cpStillClimbing = crossplayRows.filter(r => r.current >= r.peak - 10).length;
  [
    ['Console players tracked on PC 1v1', cpTracked],
    ['Highest peak', cpTopPeak],
    ['Still near their peak', cpStillClimbing],
  ].forEach(([label, value]) => {
    const el = document.createElement('div');
    el.className = 'stat-tile';
    el.innerHTML = `<div class="label">${label}</div><div class="value">${value.toLocaleString()}</div>`;
    cpStatRow.appendChild(el);
  });

  const cpPlayerLink = r => `player.html?id=${r.profileId}&ladder=${encodeURIComponent('1v1 PC')}`;

  const CP_SHOWN = 25;
  const cpMaxPeak = cpTracked ? crossplayRows[0].peak : 1;
  const cpRowsEl = document.getElementById('crossplay-rows');
  crossplayRows.slice(0, CP_SHOWN).forEach((r, i) => {
    const ceilingPct = (r.peak / cpMaxPeak) * 100;
    const currentPct = (r.current / cpMaxPeak) * 100;
    const row = document.createElement('div');
    row.className = 'peak-row';
    row.innerHTML = `
      <div class="peak-name"><span class="peak-rank">#${i + 1}</span><a href="${cpPlayerLink(r)}">${r.name}</a></div>
      <div class="peak-track">
        <div class="peak-fill-ceiling" style="width:${ceilingPct}%"></div>
        <div class="peak-fill-current" style="width:${currentPct}%"></div>
      </div>
      <div class="peak-value"><span class="peak-num">${r.peak.toLocaleString()}</span><span class="cur-sub">now ${r.current.toLocaleString()}</span></div>
    `;
    cpRowsEl.appendChild(row);
  });

  document.getElementById('crossplay-toggle-summary').textContent =
    `View all ${cpTracked.toLocaleString()} as a table`;
  const cpTableEl = document.getElementById('crossplay-table');
  cpTableEl.innerHTML = '<thead><tr><th class="num">#</th><th>Player</th><th class="num">Peak</th><th class="num">Current</th></tr></thead>' +
    '<tbody>' + crossplayRows.map((r, i) => `<tr><td class="num">${i + 1}</td><td><a href="${cpPlayerLink(r)}">${r.name}</a></td><td class="num">${r.peak.toLocaleString()}</td><td class="num">${r.current.toLocaleString()}</td></tr>`).join('') + '</tbody>';

  // ---- top squads ----
  let squadLadder = 'all';
  let squadSize = 'duos';
  const SQUAD_PLAYER_COUNT = { duos: 2, trios: 3, quads: 4 };
  const SQUAD_LADDER_LABEL = { all: 'team games', console: 'Console Team games', pc: 'PC Team games' };
  let squadSort = { key: 'games', dir: 'desc' };
  let squadFilter = '';
  let squadExpanded = false;
  const SQUAD_SHOWN = 25;

  function squadSortValue(row, key) {
    if (key === 'games') return row.games;
    if (key === 'winRate') return row.winRate;
    const idx = +key.slice(1);
    return (row.displayNames[idx]?.name || '').toLowerCase();
  }

  // When a search is active, a matched player can land in any column
  // depending on profileId (P1 is just "whoever has the lower id"), so
  // scanning "how has X done with everyone" meant checking every column.
  // Pin the matched name to the first slot instead, so it reads
  // consistently as "searched player | their teammate(s)" and the
  // remaining columns become directly comparable/sortable across rows.
  // Reorders {name, profileId} pairs together so a link never ends up
  // paired with the wrong person's name after reordering.
  function orderedNames(names, profileIds) {
    const pairs = names.map((name, i) => ({ name, profileId: profileIds[i] }));
    if (!squadFilter) return pairs;
    const matched = [], rest = [];
    pairs.forEach(p => (p.name.toLowerCase().includes(squadFilter) ? matched : rest).push(p));
    return [...matched, ...rest];
  }

  function renderSquadTable() {
    const allRows = (squads[squadLadder] || {})[squadSize] || [];
    const tableEl = document.getElementById('squad-table');
    if (!allRows.length) {
      tableEl.innerHTML = `<tbody><tr><td style="padding:16px 0;color:var(--text3);font-size:12px">No ${squadSize} with enough ${SQUAD_LADDER_LABEL[squadLadder]} together yet — teammate tracking is new, this fills in as more team games get pulled.</td></tr></tbody>`;
      return;
    }
    const rows = allRows
      .filter(r => !squadFilter || r.names.some(n => n.toLowerCase().includes(squadFilter)))
      .map(r => ({ ...r, displayNames: orderedNames(r.names, r.profileIds) }));
    if (!rows.length) {
      tableEl.innerHTML = `<tbody><tr><td style="padding:16px 0;color:var(--text3);font-size:12px">No ${squadSize} matching "${squadFilter}".</td></tr></tbody>`;
      return;
    }
    const playerCount = SQUAD_PLAYER_COUNT[squadSize];
    rows.sort((a, b) => {
      const av = squadSortValue(a, squadSort.key), bv = squadSortValue(b, squadSort.key);
      const cmp = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
      return squadSort.dir === 'asc' ? cmp : -cmp;
    });

    const totalRows = rows.length;
    const shownRows = squadExpanded ? rows : rows.slice(0, SQUAD_SHOWN);
    const expandEl = document.getElementById('squad-expand-row');
    if (totalRows > SQUAD_SHOWN) {
      expandEl.innerHTML = `<button class="pr-toggle" style="font-size:11px;padding:3px 10px" id="squad-expand-btn">${squadExpanded ? '▲ Show top 25' : `▼ Show all ${totalRows.toLocaleString()}`}</button>`;
      document.getElementById('squad-expand-btn').addEventListener('click', () => {
        squadExpanded = !squadExpanded;
        renderSquadTable();
      });
    } else {
      expandEl.innerHTML = '';
    }

    const cols = [];
    for (let i = 0; i < playerCount; i++) {
      const label = squadFilter ? (i === 0 ? 'Player' : (playerCount === 2 ? 'Teammate' : `Teammate ${i}`)) : `Player ${i + 1}`;
      cols.push({ key: `p${i}`, label });
    }
    cols.push({ key: 'games', label: 'Games together' });
    cols.push({ key: 'winRate', label: 'Win rate' });

    const thead = '<thead><tr>' + cols.map(c => {
      const isNum = c.key === 'games' || c.key === 'winRate';
      const isSorted = squadSort.key === c.key;
      const cls = [isNum ? 'num' : '', isSorted ? 'sorted' + (squadSort.dir === 'asc' ? ' asc' : '') : ''].filter(Boolean).join(' ');
      return `<th class="${cls}" data-key="${c.key}">${c.label}</th>`;
    }).join('') + '</tr></thead>';

    const tbody = '<tbody>' + shownRows.map(r => {
      const playerCells = r.displayNames.slice(0, playerCount).map(p => `<td><a href="player.html?id=${p.profileId}">${p.name}</a></td>`).join('');
      const wrPct = (r.winRate * 100).toFixed(1);
      const wrCls = r.winRate >= 0.52 ? 'wr-good' : r.winRate <= 0.48 ? 'wr-bad' : '';
      return `<tr>${playerCells}<td class="num">${r.games.toLocaleString()}</td><td class="num"><span class="${wrCls}">${wrPct}%</span></td></tr>`;
    }).join('') + '</tbody>';

    tableEl.innerHTML = thead + tbody;
    tableEl.querySelectorAll('th[data-key]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        if (squadSort.key === key) squadSort.dir = squadSort.dir === 'asc' ? 'desc' : 'asc';
        else squadSort = { key, dir: (key === 'games' || key === 'winRate') ? 'desc' : 'asc' };
        renderSquadTable();
      });
    });
  }
  renderSquadTable();
  document.querySelectorAll('#squad-size-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      squadSize = btn.dataset.size;
      squadSort = { key: 'games', dir: 'desc' };
      squadExpanded = false;
      document.querySelectorAll('#squad-size-toggle button').forEach(b => b.classList.toggle('on', b === btn));
      renderSquadTable();
    });
  });
  document.querySelectorAll('#squad-ladder-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      squadLadder = btn.dataset.ladder;
      squadSort = { key: 'games', dir: 'desc' };
      squadExpanded = false;
      document.querySelectorAll('#squad-ladder-toggle button').forEach(b => b.classList.toggle('on', b === btn));
      renderSquadTable();
    });
  });
  document.getElementById('squad-search').addEventListener('input', (e) => {
    squadFilter = e.target.value.toLowerCase().trim();
    squadExpanded = false;
    renderSquadTable();
  });

  // ---- console arabia vs pc overall ----
  const cvpConsole = weightedStatsFromByWeek(civsData.consoleArabia1v1ByWeek, 20);
  const cvpPc = weightedStatsFromByWeek(civsData.pcOverall1v1ByWeek, 20);
  const cvpRows = Object.keys(cvpConsole)
    .filter(civ => cvpPc[civ])
    .map(civ => {
      const c = cvpConsole[civ], p = cvpPc[civ];
      return { civ, consoleWr: c.wr, consoleGames: c.games, pcWr: p.wr, pcGames: p.games, diff: c.wr - p.wr };
    });
  let cvpSort = { key: 'absDiff', dir: 'desc' };
  function cvpSortValue(row, key) {
    if (key === 'civ') return row.civ.toLowerCase();
    if (key === 'absDiff') return Math.abs(row.diff);
    return row[key];
  }
  function renderCvpTable() {
    const rows = cvpRows.slice();
    rows.sort((a, b) => {
      const av = cvpSortValue(a, cvpSort.key), bv = cvpSortValue(b, cvpSort.key);
      const cmp = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
      return cvpSort.dir === 'asc' ? cmp : -cmp;
    });
    const cols = [
      { key: 'civ', label: 'Civ' },
      { key: 'consoleWr', label: 'Console' },
      { key: 'consoleGames', label: 'Games' },
      { key: 'pcWr', label: 'PC' },
      { key: 'pcGames', label: 'Games' },
      { key: 'absDiff', label: 'Diff' },
    ];
    const tableEl = document.getElementById('cvp-table');
    const thead = '<thead><tr>' + cols.map(c => {
      const isNum = c.key !== 'civ';
      const isSorted = cvpSort.key === c.key;
      const cls = [isNum ? 'num' : '', isSorted ? 'sorted' + (cvpSort.dir === 'asc' ? ' asc' : '') : ''].filter(Boolean).join(' ');
      return `<th class="${cls}" data-key="${c.key}">${c.label}</th>`;
    }).join('') + '</tr></thead>';
    const tbody = '<tbody>' + rows.map(r => {
      const diffCls = r.diff >= 0.5 ? 'wr-good' : r.diff <= -0.5 ? 'wr-bad' : '';
      return `<tr>
        <td style="white-space:nowrap"><div style="display:flex;align-items:center;gap:4px"><img src="${civIconUrl(r.civ)}" alt="" style="height:16px;width:16px;object-fit:contain;flex-shrink:0" onerror="this.style.display='none'">${r.civ}</div></td>
        <td class="num">${r.consoleWr.toFixed(1)}%</td>
        <td class="num">${abbrevGames(r.consoleGames)}</td>
        <td class="num">${r.pcWr.toFixed(1)}%</td>
        <td class="num">${abbrevGames(r.pcGames)}</td>
        <td class="num"><span class="${diffCls}">${r.diff >= 0 ? '+' : ''}${r.diff.toFixed(1)}%</span></td>
      </tr>`;
    }).join('') + '</tbody>';
    tableEl.innerHTML = thead + tbody;
    tableEl.querySelectorAll('th[data-key]').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        if (cvpSort.key === key) cvpSort.dir = cvpSort.dir === 'asc' ? 'desc' : 'asc';
        else cvpSort = { key, dir: key === 'civ' ? 'asc' : 'desc' };
        renderCvpTable();
      });
    });
  }
  renderCvpTable();
  loadAndRenderWeekly();
}

// ---- weekly recap ----
function weeklyPct(x) { return x == null ? '—' : (x * 100).toFixed(1) + '%'; }
function weeklyTable(headers, rows) {
  if (!rows.length) return '<p class="weekly-empty">No data for this segment this week.</p>';
  const thead = '<thead><tr>' + headers.map(h => `<th class="${h.num ? 'num' : ''}">${h.label}</th>`).join('') + '</tr></thead>';
  const tbody = '<tbody>' + rows.map(cells => '<tr>' + cells.map((c, i) => `<td class="${headers[i].num ? 'num' : ''}">${c}</td>`).join('') + '</tr>').join('') + '</tbody>';
  return `<table class="civ-table">${thead}${tbody}</table>`;
}

function wLink(name, id) {
  return id != null ? `<a href="player.html?id=${id}">${name}</a>` : name;
}

function renderWeeklyReport(report) {
  const g = report.totalGames;
  const headline = `
    <div class="weekly-section">
      <div class="stat-row">
        <div class="stat-tile"><div class="label">All-Time 1v1</div><div class="value">${g.allTime1v1.toLocaleString()}</div></div>
        <div class="stat-tile"><div class="label">All-Time Team</div><div class="value">${g.allTimeTeam.toLocaleString()}</div></div>
        <div class="stat-tile"><div class="label">All-Time Combined</div><div class="value">${g.allTimeCombined.toLocaleString()}</div></div>
        <div class="stat-tile"><div class="label">This Week (${report.windowStart} → ${report.windowEnd})</div><div class="value">${g.windowCombined.toLocaleString()}</div></div>
      </div>
      ${g.windowBySize ? `
      <div class="stat-row" style="margin-top:8px">
        ${Object.entries(g.windowBySize).filter(([size]) => size !== 'total').map(([size, count]) => `
          <div class="stat-tile"><div class="label">${size} This Week</div><div class="value">${count.toLocaleString()}</div></div>
        `).join('')}
      </div>` : ''}
      <p class="sub-desc">+${g.growth1v1.toLocaleString()} 1v1 / +${g.growthTeam.toLocaleString()} Team since last report · this week: ${g.window1v1.toLocaleString()} 1v1, ${g.windowTeam.toLocaleString()} Team${g.lowActivityCaveat ? ' — <b>note:</b> this looks low for the tracked pool, likely a data-refresh lag rather than an real activity drop' : ''}</p>
    </div>`;

  const mostGames = `
    <div class="weekly-section">
      <h3>Players With the Most Games This Week</h3>
      ${weeklyTable(
        [{ label: 'Player' }, { label: 'Games', num: true }, { label: 'Win Rate', num: true }],
        report.mostGames.map(p => [wLink(p.name, p.profileId), p.games.toLocaleString(), weeklyPct(p.winRate)])
      )}
    </div>`;

  const rivalries = `
    <div class="weekly-section">
      <h3>Rivalries</h3>
      <p class="sub-desc">1v1 pairs with at least 3 games together, ranked by whoever played each other most recently — a constantly-updating list rather than a fixed all-time top 5.</p>
      ${!report.rivalries || !report.rivalries.length ? '<p class="weekly-empty">No qualifying rivalries found.</p>' : report.rivalries.map(r => `
        <div class="weekly-highlight" style="margin-bottom:10px">
          <b>${wLink(r.nameA, r.idA)}</b> vs <b>${wLink(r.nameB, r.idB)}</b> — ${r.allTimeGames.toLocaleString()} games all-time, ${r.record}, last played ${r.lastPlayed}
          <div class="sub-desc" style="margin-top:4px">${r.recentGames.map(g => `${g.date} on ${g.map} (${g.winnerName} won)`).join(' · ')}</div>
        </div>`).join('')}
    </div>`;

  const upsets = `
    <div class="weekly-section">
      <h3>Biggest Upsets This Week</h3>
      <p class="sub-desc">Based on each player's current rating, not their rating at the time of the match — an approximation.</p>
      ${weeklyTable(
        [{ label: 'Winner' }, { label: 'Loser' }, { label: 'Gap', num: true }, { label: 'Map' }, { label: 'Date' }],
        report.biggestUpsets.map(u => [`${wLink(u.winnerName, u.winnerId)} (${u.winnerRating})`, `${wLink(u.loserName, u.loserId)} (${u.loserRating})`, u.gap.toLocaleString(), u.map, u.date])
      )}
    </div>`;

  const newPlayers = `
    <div class="weekly-section">
      <h3>New/Returning Players</h3>
      ${weeklyTable(
        [{ label: 'Player' }, { label: 'Games', num: true }, { label: 'Rating', num: true }, { label: 'First 10 WR', num: true }, { label: 'Day Span', num: true }],
        report.newPlayers.map(p => [wLink(p.name, p.profileId), p.totalGames.toLocaleString(), p.rating ?? '—', weeklyPct(p.firstTenWinRate), p.daySpan == null ? '—' : p.daySpan.toLocaleString()])
      )}
    </div>`;

  const cp = report.civPopularity;
  const civPopularity = `
    <div class="weekly-section">
      <h3>Civ Popularity This Week</h3>
      <p class="sub-desc">Most picked</p>
      ${weeklyTable([{ label: 'Civ' }, { label: 'Games', num: true }, { label: 'Win Rate', num: true }], cp.topPicked.map(c => [c.civ, c.games.toLocaleString(), weeklyPct(c.winRate)]))}
      <p class="sub-desc" style="margin-top:12px">Highest win rate</p>
      ${weeklyTable([{ label: 'Civ' }, { label: 'Games', num: true }, { label: 'Win Rate', num: true }], cp.topWinRate.map(c => [c.civ, c.games.toLocaleString(), weeklyPct(c.winRate)]))}
      <p class="sub-desc" style="margin-top:12px">Biggest movers vs. last week</p>
      ${weeklyTable([{ label: 'Civ' }, { label: 'Change', num: true }, { label: 'Now' }, { label: 'Prior' }], cp.biggestMovers.map(c => [c.civ, `${c.pctPointChange >= 0 ? '+' : ''}${c.pctPointChange.toFixed(1)}pp`, weeklyPct(c.nowShare), weeklyPct(c.priorShare)]))}
    </div>`;

  const bm = report.biggestMovers;
  const movers = `
    <div class="weekly-section">
      <h3>Biggest Movers (ELO)</h3>
      <p class="sub-desc">Gainers</p>
      ${weeklyTable([{ label: 'Player' }, { label: 'Change', num: true }, { label: 'Rating Now', num: true }], bm.gainers.map(p => [wLink(p.name, p.profileId), `+${p.delta}`, p.ratingNow.toLocaleString()]))}
      <p class="sub-desc" style="margin-top:12px">Losers</p>
      ${weeklyTable([{ label: 'Player' }, { label: 'Change', num: true }, { label: 'Rating Now', num: true }], bm.losers.map(p => [wLink(p.name, p.profileId), `${p.delta}`, p.ratingNow.toLocaleString()]))}
      ${bm.newTop20.length ? `<p class="sub-desc" style="margin-top:12px">New to the top 20: ${bm.newTop20.map(p => `${wLink(p.name, p.profileId)} (${p.ratingNow.toLocaleString()})`).join(', ')}</p>` : ''}
    </div>`;

  const sq = report.topSquads;
  const squadTable = (label, rows) => `
      <p class="sub-desc" style="margin-top:12px">${label}</p>
      ${weeklyTable([{ label: 'Squad' }, { label: 'Games', num: true }, { label: 'Win Rate', num: true }], rows.map(r => [r.names.map((n, i) => wLink(n, r.profileIds?.[i])).join(' + '), r.games.toLocaleString(), weeklyPct(r.winRate)]))}`;
  const squads = `
    <div class="weekly-section">
      <h3>Top 5 Duos / Trios / Quads This Week</h3>
      ${squadTable('Duos', sq.duos)}
      ${squadTable('Trios', sq.trios)}
      ${squadTable('Quads', sq.quads)}
    </div>`;

  const pcStandings = report.pc1v1Standings ? `
    <div class="weekly-section">
      <h3>PC 1v1 Standings — Console Roster</h3>
      <p class="sub-desc">Current 1v1 PC rating for tracked console players with crossplay history. Rank-movement tracking (gainers/losers, like Biggest Movers above) starts next week now that a rating snapshot exists to diff against — this week just shows where everyone stands.</p>
      ${weeklyTable(
        [{ label: 'Player' }, { label: 'PC 1v1 Rating', num: true }, { label: 'Games This Week', num: true }, { label: 'Total PC 1v1 Games', num: true }],
        report.pc1v1Standings.map(p => [wLink(p.name, p.profileId), p.rating.toLocaleString(), p.windowGamesPC1v1.toLocaleString(), p.totalGamesPC1v1.toLocaleString()])
      )}
    </div>` : '';

  return headline + mostGames + rivalries + upsets + newPlayers + civPopularity + movers + squads + pcStandings;
}

async function loadAndRenderWeekly() {
  const descEl = document.getElementById('weekly-desc');
  const contentEl = document.getElementById('weekly-content');
  const selectEl = document.getElementById('weekly-archive-select');
  try {
    const idxRes = await fetch(`${WEEKLY_INDEX_URL}?t=${Date.now()}`, { cache: 'no-store' });
    if (!idxRes.ok) throw new Error('no index yet');
    const dates = await idxRes.json();
    if (!dates.length) {
      contentEl.innerHTML = '<p class="weekly-empty">First weekly recap is coming soon — check back after the next Monday update.</p>';
      return;
    }

    selectEl.innerHTML = dates.map(d => `<option value="${d}">Week of ${d}</option>`).join('');
    selectEl.style.display = '';

    async function showWeek(date) {
      contentEl.innerHTML = '<div class="loading">Loading weekly recap…</div>';
      try {
        const res = await fetch(`${weeklyReportUrl(date)}?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const report = await res.json();
        descEl.textContent = `What happened in the console scene, ${report.windowStart} → ${report.windowEnd}.`;
        contentEl.innerHTML = renderWeeklyReport(report);
      } catch (e) {
        contentEl.innerHTML = `<div class="error">Could not load this week's recap: ${e.message}</div>`;
      }
    }

    selectEl.addEventListener('change', () => showWeek(selectEl.value));
    showWeek(dates[0]);
  } catch (e) {
    contentEl.innerHTML = '<p class="weekly-empty">First weekly recap is coming soon — check back after the next Monday update.</p>';
  }
}

loadAndRender();
</script>
