<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Player Spotlight — AoE Auto Scout</title>
<style>
:root{
  --bg:#0f0d0b;--surf:#1c1814;--surf2:#242018;--border:#332c24;--border2:#4a3f30;
  --amber:#c8922a;--amberL:#f0b458;--amberBg:rgba(200,146,42,.1);
  --text:#ede5d8;--text2:#a8967e;--text3:#6b5840;
  --green:#4ade80;--greenBg:rgba(74,222,128,.07);--greenBd:rgba(74,222,128,.25);
  --red:#f87171;--redBg:rgba(248,113,113,.07);--redBd:rgba(248,113,113,.25);
  --radius:8px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px;}

header{display:flex;align-items:center;gap:14px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border);}
header h1{font-size:20px;margin:0;}
header .back{font-size:13px;color:var(--text2);text-decoration:none;}
header .back:hover{color:var(--amberL);}
.subtitle{font-size:13px;color:var(--text2);margin:2px 0 0;}

.card{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:22px 22px 18px;margin-bottom:22px;}
.card h2{font-size:15px;margin:0 0 4px;color:var(--amberL);}
.card .desc{font-size:12px;color:var(--text2);margin:0 0 18px;}

.player-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;}
.player-name{font-size:26px;font-weight:800;}
.player-badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px;}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--surf2);border:1px solid var(--border2);color:var(--text2);}
.badge.rating{background:var(--amberBg);color:var(--amberL);border-color:var(--amber);}
.badge.rating.crossplay{background:var(--surf2);color:var(--text2);border-color:var(--border2);}

.ladder-toggle{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin:0 auto 16px;width:fit-content;}
.ladder-toggle button{background:none;border:none;padding:8px 16px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap;}
.ladder-toggle button.on{background:var(--amber);color:#1a0a00;}

.stat-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:6px;}
.stat-tile{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;text-align:center;min-width:90px;flex:0 1 auto;}
.stat-tile .label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:4px;}
.stat-tile .value{font-size:19px;font-weight:700;color:var(--text);}
.stat-tile .value.good{color:var(--green);}
.stat-tile .value.bad{color:var(--red);}

table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px;}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;}
th{color:var(--text3);font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.04em;cursor:pointer;user-select:none;white-space:nowrap;}
th:hover{color:var(--amberL);}
th.sorted::after{content:' ▾';color:var(--amber);}
th.sorted.asc::after{content:' ▴';}
th.num,td.num{text-align:center;}
td a{color:inherit;text-decoration:none;}
td a:hover{color:var(--amberL);text-decoration:underline;}
.wr-good{color:var(--green);}
.wr-bad{color:var(--red);}
.pr-sub{color:var(--text3);font-size:10px;}
.table-scroll{max-height:340px;overflow-y:auto;}

.chart-wrap{position:relative;}
svg{display:block;width:100%;height:auto;overflow:visible;}
.gridline{stroke:var(--border);stroke-width:1;}
.baseline{stroke:var(--border2);stroke-width:1;}
.refline{stroke:var(--text3);stroke-width:1;stroke-dasharray:2 3;opacity:.6;}
.tick-label{fill:var(--text3);font-size:10px;}
.axis-label{fill:var(--text2);font-size:11px;}
.trend-bar{cursor:pointer;}
.trend-bar.good{fill:var(--green);}
.trend-bar.bad{fill:var(--red);}
.trend-bar.neutral{fill:var(--text3);}
.hit-area{fill:transparent;cursor:pointer;}
.tooltip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:6px;transform:translate(-50%,-100%);white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5;}
.tooltip.show{opacity:1;}
.tooltip .row1{font-weight:700;}
.tooltip .row2{color:var(--text2);}

.loading,.error{font-size:13px;color:var(--text2);padding:20px;text-align:center;}
.error{color:var(--red);}

#player-search{width:100%;height:36px;padding:0 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;outline:none;}
#player-search:focus{border-color:var(--amber);}
#player-search-results{margin-top:10px;display:flex;flex-direction:column;gap:4px;}
#player-search-results:empty{margin-top:0;}
.search-result{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);text-decoration:none;color:var(--text);font-size:13px;}
.search-result:hover{border-color:var(--amber);}
.search-result .sr-name{font-weight:700;}
.search-result .sr-meta{font-size:11px;color:var(--text3);}
.search-result .sr-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:20px;background:var(--surf2);border:1px solid var(--border2);color:var(--text2);flex-shrink:0;}
.search-result .sr-tag.live{color:var(--amberL);border-color:var(--amber);}
.search-hint{font-size:11px;color:var(--text3);padding:4px 2px;}

.similar-players{display:flex;flex-wrap:wrap;gap:8px;}
.similar-players a{display:flex;flex-direction:column;gap:2px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);text-decoration:none;color:var(--text);font-size:12px;min-width:100px;}
.similar-players a:hover{border-color:var(--amber);}
.similar-players a b{font-size:13px;}
.similar-players a span{font-size:11px;color:var(--text3);}

.tracker-hint{font-size:11px;color:var(--text3);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-top:10px;}
.tracker-hint a{color:var(--amberL);}
.tracker-hint a:hover{text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🔎 Player Spotlight</h1>
      <p class="subtitle"><a class="back" href="index.html">← AoE Auto Scout</a> · <a class="back" href="insights.html">Insights</a></p>
    </div>
  </header>

  <div class="card" id="lookup-card">
    <h2>Look Up a Player</h2>
    <p class="desc">Search anyone tracked on the site, or any AoE2 player by name/profileId — untracked players get fetched live.</p>
    <input type="text" id="player-search" placeholder="Search by name or profileId…" autocomplete="off">
    <div id="player-search-results"></div>
  </div>

  <div id="content">
    <div class="loading">Loading player data…</div>
  </div>
</div>

<script>
const PLAYER_DATA_BASE = 'https://raw.githubusercontent.com/robbyho-aoe2/player-data/main/data';
const svgNS = 'http://www.w3.org/2000/svg';
const params = new URLSearchParams(location.search);
const profileId = params.get('id') || '197930'; // defaults to T90
// Populated once meta loads — profileIds worth linking to their own
// spotlight page. An opponent/teammate outside our tracked roster (most
// of the matchmaking pool) just renders as plain text instead of a dead
// link to a page that would 404 on "not found in tracked roster".
let ALL_TRACKED = []; // meta.players, kept around for search + similar-players
// Every opponent/teammate with a profileId gets linked now — player.html
// handles untracked players via a live lookup (see fetchLivePlayer below),
// so this no longer needs to gate on TRACKED_IDS to avoid a dead link.
function playerLinkOrName(name, id) {
  const label = name || (id != null ? `#${id}` : 'Unknown');
  if (id == null) return label;
  return `<a href="player.html?id=${id}">${label}</a>`;
}

// ---- live lookup for players outside the tracked roster ----
// Ported from update_players.py's extract_match/get_opponents/
// get_teammates so an untracked player's spotlight page computes
// identically to a tracked one, just fetched fresh instead of from a
// pre-backfilled file. CORS is open on this API (verified), so this
// runs straight from the browser.
const LIVE_MATCHES_URL = 'https://data.aoe2companion.com/api/matches';
const LIVE_PROFILE_URL = 'https://data.aoe2companion.com/api/profiles';
const LIVE_PAGE_CAP = 25; // ~500 matches — bounded so an on-demand lookup stays fast
const LADDER_MAP = {
  '1v1 Random Map (Console)':     '1v1 Console',
  '1v1 Random Map (Controller)':  '1v1 Console',
  'Team Random Map (Console)':    'Team Console',
  'Team Random Map (Controller)': 'Team Console',
  '1v1 Random Map':               '1v1 PC',
  'Team Random Map':              'Team PC',
};
const PROFILE_LADDER_MAP = { rm_1v1_console: '1v1 Console', rm_team_console: 'Team Console', rm_1v1: '1v1 PC', rm_team: 'Team PC' };
const CIV_NORM = { Mayans: 'Maya', Inca: 'Incas' };
const MAX_DUR = 5 * 3600;

function findOurPlayer(match, pid) {
  for (const team of match.teams || []) {
    for (const p of team.players || []) {
      if (p.profileId === pid) return p;
    }
  }
  return null;
}
function getOpponentsLive(match, pid) {
  const teams = match.teams || [];
  let ourIdx = -1;
  teams.forEach((t, i) => { if (ourIdx === -1 && (t.players || []).some(p => p.profileId === pid)) ourIdx = i; });
  if (ourIdx === -1) return [];
  const out = [];
  teams.forEach((t, i) => {
    if (i === ourIdx) return;
    (t.players || []).forEach(p => { if (p.profileId != null) out.push({ profileId: p.profileId, name: p.name }); });
  });
  return out;
}
function getTeammatesLive(match, pid) {
  for (const t of match.teams || []) {
    const players = t.players || [];
    if (players.some(p => p.profileId === pid)) {
      return players.filter(p => p.profileId != null && p.profileId !== pid).map(p => ({ profileId: p.profileId, name: p.name }));
    }
  }
  return [];
}
function computeDurationLive(match) {
  const start = match.started ? new Date(match.started) : null;
  const end = match.finished ? new Date(match.finished) : null;
  if (!start || !end || isNaN(start) || isNaN(end)) return null;
  const dur = Math.round((end - start) / 1000);
  return (dur > 0 && dur <= MAX_DUR) ? dur : null;
}
function coerceDateLive(ts) {
  if (!ts) return null;
  const d = new Date(ts);
  return isNaN(d) ? null : d.toISOString().slice(0, 10);
}
function extractMatchLive(raw, pid) {
  const ladder = LADDER_MAP[raw.leaderboardName || ''];
  if (!ladder) return null;
  if (raw.matchId == null) return null;
  const ourPlayer = findOurPlayer(raw, pid);
  const won = ourPlayer ? ourPlayer.won : null;
  const civRaw = ourPlayer ? (ourPlayer.civName || ourPlayer.civilizationName || ourPlayer.civ) : null;
  const civ = civRaw != null ? (CIV_NORM[civRaw] || civRaw) : null;
  const map = raw.mapName || raw.map || null;
  return {
    ladder,
    record: {
      matchId: raw.matchId, civ, map, won,
      date: coerceDateLive(raw.started || raw.finished),
      dur: computeDurationLive(raw),
      opponents: getOpponentsLive(raw, pid),
      teammates: getTeammatesLive(raw, pid),
    },
  };
}

async function fetchLivePlayer(id) {
  const numId = Number(id);
  const profRes = await fetch(`${LIVE_PROFILE_URL}/${numId}`);
  if (!profRes.ok) throw new Error(`Player ${id} not found (HTTP ${profRes.status})`);
  const profile = await profRes.json();
  if (!profile || !profile.name) throw new Error(`Player ${id} not found`);

  const ladders = {
    '1v1 Console': { meta: {}, matches: [] }, 'Team Console': { meta: {}, matches: [] },
    '1v1 PC': { meta: {}, matches: [] }, 'Team PC': { meta: {}, matches: [] },
  };
  for (let page = 1; page <= LIVE_PAGE_CAP; page++) {
    const res = await fetch(`${LIVE_MATCHES_URL}?profile_ids=${numId}&page=${page}`);
    if (!res.ok) break;
    const data = await res.json();
    const raw = Array.isArray(data) ? data : (data.matches || []);
    if (!raw.length) break;
    for (const m of raw) {
      const ex = extractMatchLive(m, numId);
      if (ex) ladders[ex.ladder].matches.push(ex.record);
    }
    if (raw.length < 20) break; // short page — end of this player's history
  }

  const ratings = {}, peaks = {};
  (profile.ratings || []).forEach(r => {
    const ladderName = PROFILE_LADDER_MAP[r.leaderboardId];
    if (!ladderName || !r.ratings || !r.ratings.length) return;
    ratings[ladderName] = r.ratings[0].rating;
    peaks[ladderName] = { peak: Math.max(...r.ratings.map(x => x.rating)), current: r.ratings[0].rating };
  });

  return {
    entry: { name: profile.name, profileId: numId, group: null, ratings, peaks, live: true },
    player: { name: profile.name, profileId: numId, group: null, ladders },
  };
}

// ---- search: "See <name>'s Insights" ----
let searchDebounce = null;
function setupPlayerSearch() {
  const input = document.getElementById('player-search');
  const resultsEl = document.getElementById('player-search-results');
  input.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    const q = input.value.trim();
    if (q.length < 2) { resultsEl.innerHTML = ''; return; }
    searchDebounce = setTimeout(() => runPlayerSearch(q, resultsEl), 300);
  });
}

async function runPlayerSearch(query, resultsEl) {
  const qLower = query.toLowerCase();
  const localMatches = ALL_TRACKED
    .filter(p => p.name && p.name.toLowerCase().includes(qLower))
    .slice(0, 8);
  const foundIds = new Set(localMatches.map(p => p.profileId));

  resultsEl.innerHTML = renderSearchResults(localMatches, []) + '<div class="search-hint">Searching AoE2Companion for more…</div>';

  // Numeric query — could be a direct profileId even if not in our roster.
  const isNumeric = /^\d+$/.test(query);
  const liveResults = [];
  try {
    if (isNumeric && !foundIds.has(Number(query))) {
      const res = await fetch(`${LIVE_PROFILE_URL}/${query}`);
      if (res.ok) {
        const p = await res.json();
        if (p && p.name) liveResults.push({ profileId: Number(query), name: p.name });
      }
    } else if (!isNumeric && query.length >= 3) {
      const res = await fetch(`${LIVE_PROFILE_URL}?search=${encodeURIComponent(query)}`);
      if (res.ok) {
        const data = await res.json();
        (data.profiles || []).forEach(p => {
          if (!foundIds.has(p.profileId) && liveResults.length < 8) {
            foundIds.add(p.profileId);
            liveResults.push({ profileId: p.profileId, name: p.name, games: p.games });
          }
        });
      }
    }
  } catch (e) { /* live search is best-effort — local results still stand */ }

  resultsEl.innerHTML = renderSearchResults(localMatches, liveResults);
}

function renderSearchResults(local, live) {
  if (!local.length && !live.length) return '<div class="search-hint">No matches.</div>';
  const row = (p, isLive) => `
    <a class="search-result" href="player.html?id=${p.profileId}">
      <span><span class="sr-name">${p.name}</span>${p.games != null ? `<span class="sr-meta"> · ${Number(p.games).toLocaleString()} games</span>` : ''}</span>
      <span class="sr-tag${isLive ? ' live' : ''}">${isLive ? 'live lookup' : 'tracked'}</span>
    </a>`;
  return local.map(p => row(p, false)).join('') + live.map(p => row(p, true)).join('');
}

function fmtDur(seconds) {
  const m = Math.floor(seconds / 60), s = Math.round(seconds % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

async function loadAndRender() {
  const content = document.getElementById('content');
  try {
    const metaRes = await fetch(`${PLAYER_DATA_BASE}/aggregate-meta.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!metaRes.ok) throw new Error('HTTP ' + metaRes.status);
    const meta = await metaRes.json();
    ALL_TRACKED = meta.players || [];
    setupPlayerSearch();

    let entry = ALL_TRACKED.find(p => String(p.profileId) === String(profileId));
    let player;
    if (entry) {
      const dataRes = await fetch(`${PLAYER_DATA_BASE}/${entry.group}/${profileId}.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!dataRes.ok) throw new Error('HTTP ' + dataRes.status);
      player = await dataRes.json();
    } else {
      content.innerHTML = '<div class="loading">Not in the tracked roster — fetching live from AoE2Companion…</div>';
      const live = await fetchLivePlayer(profileId);
      entry = live.entry;
      player = live.player;
    }

    render(content, entry, player);
  } catch (e) {
    content.innerHTML = `<div class="error">Could not load player: ${e.message}</div>`;
  }
}

function render(content, entry, player) {
  const ladders = Object.entries(player.ladders || {})
    .filter(([, ld]) => (ld.matches || []).length > 0)
    .map(([name]) => name);

  if (!ladders.length) {
    content.innerHTML = `<div class="error">${entry.name} has no match history pulled yet.</div>`;
    return;
  }

  content.innerHTML = `
    <div class="card">
      <div class="player-hero">
        <div>
          <div class="player-name">${entry.name}</div>
          <div class="player-badges" id="player-badges"></div>
        </div>
      </div>
      ${entry.live ? `<div class="tracker-hint">Not part of the permanent AoE Auto Scout roster — this page was fetched live from AoE2Companion and won't be saved or refreshed automatically. Want ${entry.name} (profileId ${entry.profileId}) tracked permanently? Request it in the <a href="https://discord.gg/2uRZG6qSyy" target="_blank" rel="noopener">Discord</a> or in a comment on a <a href="https://www.youtube.com/@Fastcastleandchill" target="_blank" rel="noopener">Fast Castle and Chill</a> video.</div>` : ''}
    </div>

    <div class="card">
      <div class="ladder-toggle" id="ladder-toggle"></div>
      <div class="stat-row" id="stat-row"></div>
    </div>

    <div class="card" id="similar-card">
      <h2>Similar Players</h2>
      <p class="desc" id="similar-desc">Tracked players with a close rating on this ladder.</p>
      <div class="similar-players" id="similar-players"></div>
    </div>

    <div class="card">
      <h2>Win Rate Over Time</h2>
      <p class="desc">Monthly win rate for the last 24 months, bar height = games played that month.</p>
      <div class="chart-wrap">
        <svg id="trend-chart" viewBox="0 0 820 260" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="tooltip" id="trend-tooltip"></div>
      </div>
    </div>

    <div class="card">
      <h2>Civ Pool</h2>
      <p class="desc" id="civ-desc">Every civ ${entry.name} has played on this ladder, sorted by games — click a column to re-sort, scroll for the full list.</p>
      <div class="table-scroll"><table id="civ-table"></table></div>
    </div>

    <div class="card">
      <h2>Map Pool</h2>
      <p class="desc" id="map-desc">Performance by map — scroll for the full list.</p>
      <div class="table-scroll"><table id="map-table"></table></div>
    </div>

    <div class="card">
      <h2>Top 10 Opponents</h2>
      <p class="desc" id="opponents-desc">Head-to-head record vs. the most-played opponents.</p>
      <table id="opponents-table"></table>
    </div>

    <div class="card" id="teammates-card">
      <h2>Most Played Teammates</h2>
      <p class="desc" id="teammates-desc">Win rate alongside the most-played teammates.</p>
      <table id="teammates-table"></table>
    </div>
  `;

  const badgesEl = document.getElementById('player-badges');
  const shownLadders = new Set(Object.keys(entry.ratings || {}));
  // entry.ratings is restricted to the player's own group's ladders (e.g.
  // console players only get 1v1/Team Console here), but entry.peaks
  // always carries every ladder regardless of group — so a console
  // player's PC crossplay rating never shows up in ratings even when
  // they have one. Fill those in from peaks as extra pills.
  const crossplayBadges = Object.entries(entry.peaks || {})
    .filter(([l, p]) => !shownLadders.has(l) && p && p.current != null)
    .map(([l, p]) => `<span class="badge rating crossplay">${l}: ${p.current}</span>`)
    .join('');
  badgesEl.innerHTML = `<span class="badge">${entry.group || 'not tracked'}</span>` +
    Object.entries(entry.ratings || {}).map(([l, r]) => `<span class="badge rating">${l}: ${r}</span>`).join('') +
    crossplayBadges;

  const requestedLadder = params.get('ladder');
  let activeLadder = ladders.includes(requestedLadder) ? requestedLadder : ladders[0];
  const toggleEl = document.getElementById('ladder-toggle');
  toggleEl.innerHTML = ladders.map(l => `<button data-ladder="${l}" class="${l === activeLadder ? 'on' : ''}">${l}</button>`).join('');
  toggleEl.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      activeLadder = btn.dataset.ladder;
      toggleEl.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
      renderLadder(activeLadder);
    });
  });

  function renderLadder(ladderName) {
    const matches = player.ladders[ladderName].matches || [];
    const wins = matches.filter(m => m.won).length;
    const durs = matches.map(m => m.dur).filter(d => d != null);
    const avgDur = durs.length ? durs.reduce((a, b) => a + b, 0) / durs.length : 0;

    // ---- stat tiles ----
    const winPct = matches.length ? (wins / matches.length * 100) : 0;
    const statRow = document.getElementById('stat-row');
    statRow.innerHTML = '';
    [
      ['Games', matches.length.toLocaleString()],
      ['Wins', wins.toLocaleString()],
      ['Win Rate', winPct.toFixed(1) + '%', winPct >= 52 ? 'good' : winPct <= 48 ? 'bad' : ''],
      ['Avg Length', durs.length ? fmtDur(avgDur) : '—'],
      ['Longest', durs.length ? fmtDur(Math.max(...durs)) : '—'],
    ].forEach(([label, value, cls]) => {
      const el = document.createElement('div');
      el.className = 'stat-tile';
      el.innerHTML = `<div class="label">${label}</div><div class="value${cls ? ' ' + cls : ''}">${value}</div>`;
      statRow.appendChild(el);
    });

    // ---- win rate over time (monthly, last 24 months) ----
    renderTrend(matches);

    // ---- civ pool ----
    renderBreakdownTable('civ-table', matches, m => m.civ);
    // ---- map pool ----
    renderBreakdownTable('map-table', matches, m => m.map);
    // ---- top opponents ----
    renderOpponentsTable(matches);
    // ---- top teammates ----
    renderTeammatesTable(matches, ladderName);
    // ---- similar players (by rating, this ladder) ----
    renderSimilarPlayers(ladderName);
  }

  function renderSimilarPlayers(ladderName) {
    const cardEl = document.getElementById('similar-card');
    const descEl = document.getElementById('similar-desc');
    const listEl = document.getElementById('similar-players');
    const myRating = (entry.ratings || {})[ladderName];
    if (myRating == null) {
      descEl.textContent = `Not enough ${ladderName} games for a rating yet.`;
      listEl.innerHTML = '';
      return;
    }
    const pool = ALL_TRACKED
      .filter(p => p.profileId !== entry.profileId && p.ratings && p.ratings[ladderName] != null)
      .map(p => ({ name: p.name, profileId: p.profileId, rating: p.ratings[ladderName], diff: Math.abs(p.ratings[ladderName] - myRating) }))
      .sort((a, b) => a.diff - b.diff)
      .slice(0, 8);
    descEl.textContent = `Tracked players closest to ${entry.name}'s ${ladderName} rating (${myRating}).`;
    if (!pool.length) { listEl.innerHTML = '<p class="weekly-empty" style="font-size:12px;color:var(--text3)">No other tracked players on this ladder yet.</p>'; return; }
    listEl.innerHTML = pool.map(p => `<a href="player.html?id=${p.profileId}"><b>${p.name}</b><span>${p.rating} rating</span></a>`).join('');
  }

  function renderOpponentsTable(matches) {
    const opponents = {};
    let matchesWithData = 0;
    matches.forEach(m => {
      if (!m.opponents || !m.opponents.length) return;
      matchesWithData++;
      m.opponents.forEach(o => {
        const key = o.profileId != null ? o.profileId : o.name;
        if (key == null) return;
        if (!opponents[key]) opponents[key] = { name: o.name || `#${o.profileId}`, profileId: o.profileId, games: 0, wins: 0 };
        opponents[key].games++;
        if (m.won) opponents[key].wins++;
      });
    });
    const rows = Object.values(opponents).sort((a, b) => b.games - a.games).slice(0, 10);

    const descEl = document.getElementById('opponents-desc');
    descEl.textContent = matchesWithData
      ? `Head-to-head record vs. the 10 most-played opponents, from ${matchesWithData.toLocaleString()} of ${matches.length.toLocaleString()} matches with opponent data captured.`
      : `No opponent data captured yet for this ladder — tracking was added recently, so only new matches from here on will have it.`;

    const tableEl = document.getElementById('opponents-table');
    if (!rows.length) { tableEl.innerHTML = ''; return; }
    const thead = '<thead><tr><th>Opponent</th><th class="num">Games</th><th class="num">Win Rate</th></tr></thead>';
    const tbody = '<tbody>' + rows.map(r => {
      const wr = r.wins / r.games;
      const wrCls = wr >= 0.52 ? 'wr-good' : wr <= 0.48 ? 'wr-bad' : '';
      return `<tr><td>${playerLinkOrName(r.name, r.profileId)}</td><td class="num">${r.games}</td><td class="num ${wrCls}">${(wr * 100).toFixed(1)}%</td></tr>`;
    }).join('') + '</tbody>';
    tableEl.innerHTML = thead + tbody;
  }

  function renderTeammatesTable(matches, ladderName) {
    const teammates = {};
    let matchesWithTeammates = 0;
    matches.forEach(m => {
      if (!m.teammates || !m.teammates.length) return;
      matchesWithTeammates++;
      m.teammates.forEach(t => {
        const key = t.profileId != null ? t.profileId : t.name;
        if (key == null) return;
        if (!teammates[key]) teammates[key] = { name: t.name || `#${t.profileId}`, profileId: t.profileId, games: 0, wins: 0 };
        teammates[key].games++;
        if (m.won) teammates[key].wins++;
      });
    });
    const rows = Object.values(teammates).sort((a, b) => b.games - a.games).slice(0, 10);

    const cardEl = document.getElementById('teammates-card');
    const isTeamLadder = /team/i.test(ladderName);
    if (!isTeamLadder) { cardEl.style.display = 'none'; return; }
    cardEl.style.display = '';

    const descEl = document.getElementById('teammates-desc');
    descEl.textContent = matchesWithTeammates
      ? `Win rate alongside the 10 most-played teammates, from ${matchesWithTeammates.toLocaleString()} of ${matches.length.toLocaleString()} matches with teammate data captured.`
      : `No teammate data captured yet for this ladder — tracking was added recently, so only new matches from here on will have it.`;

    const tableEl = document.getElementById('teammates-table');
    if (!rows.length) { tableEl.innerHTML = ''; return; }
    const thead = '<thead><tr><th>Teammate</th><th class="num">Games</th><th class="num">Win Rate</th></tr></thead>';
    const tbody = '<tbody>' + rows.map(r => {
      const wr = r.wins / r.games;
      const wrCls = wr >= 0.52 ? 'wr-good' : wr <= 0.48 ? 'wr-bad' : '';
      return `<tr><td>${playerLinkOrName(r.name, r.profileId)}</td><td class="num">${r.games}</td><td class="num ${wrCls}">${(wr * 100).toFixed(1)}%</td></tr>`;
    }).join('') + '</tbody>';
    tableEl.innerHTML = thead + tbody;
  }

  function renderTrend(matches) {
    const svg = document.getElementById('trend-chart');
    svg.innerHTML = '';
    const tooltip = document.getElementById('trend-tooltip');
    const wrap = svg.parentElement;

    const months = {};
    matches.forEach(m => {
      if (!m.date) return;
      const key = m.date.slice(0, 7); // YYYY-MM
      if (!months[key]) months[key] = { games: 0, wins: 0 };
      months[key].games++;
      if (m.won) months[key].wins++;
    });
    const sortedKeys = Object.keys(months).sort();
    const last24 = sortedKeys.slice(-24);
    if (!last24.length) return;

    const W = 820, H = 260;
    const marginL = 36, marginR = 10, marginT = 14, marginB = 34;
    const plotW = W - marginL - marginR, plotH = H - marginT - marginB;
    const binW = plotW / last24.length;
    const maxGames = Math.max(...last24.map(k => months[k].games));

    const y = (v) => marginT + plotH - (v / maxGames) * plotH;
    [0, 0.5, 1].forEach(f => {
      const val = Math.round(maxGames * f);
      const yy = y(val);
      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('x1', marginL); line.setAttribute('x2', W - marginR);
      line.setAttribute('y1', yy); line.setAttribute('y2', yy);
      line.setAttribute('class', f === 0 ? 'baseline' : 'gridline');
      svg.appendChild(line);
      const label = document.createElementNS(svgNS, 'text');
      label.setAttribute('x', marginL - 6); label.setAttribute('y', yy + 3);
      label.setAttribute('text-anchor', 'end'); label.setAttribute('class', 'tick-label');
      label.textContent = val;
      svg.appendChild(label);
    });

    const gap = 2;
    last24.forEach((key, i) => {
      const { games, wins } = months[key];
      const wr = games ? wins / games : 0;
      const x = marginL + i * binW;
      const barW = binW - gap;
      const barH = (games / maxGames) * plotH;
      const cls = wr >= 0.52 ? 'good' : wr <= 0.48 ? 'bad' : 'neutral';

      const bar = document.createElementNS(svgNS, 'rect');
      bar.setAttribute('x', x); bar.setAttribute('y', y(games));
      bar.setAttribute('width', Math.max(barW, 1)); bar.setAttribute('height', Math.max(barH, 0));
      bar.setAttribute('rx', 2);
      bar.setAttribute('class', `trend-bar ${cls}`);
      svg.appendChild(bar);

      const hit = document.createElementNS(svgNS, 'rect');
      hit.setAttribute('x', x); hit.setAttribute('y', marginT);
      hit.setAttribute('width', Math.max(barW, 1)); hit.setAttribute('height', plotH);
      hit.setAttribute('class', 'hit-area');
      hit.addEventListener('mousemove', (e) => {
        const box = wrap.getBoundingClientRect();
        tooltip.style.left = (e.clientX - box.left) + 'px';
        tooltip.style.top = (e.clientY - box.top - 10) + 'px';
        tooltip.innerHTML = `<div class="row1">${key}</div><div class="row2">${games} games · ${(wr * 100).toFixed(0)}% win rate</div>`;
        tooltip.classList.add('show');
      });
      hit.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
      svg.appendChild(hit);

      if (i % 3 === 0 || i === last24.length - 1) {
        const tick = document.createElementNS(svgNS, 'text');
        tick.setAttribute('x', x + barW / 2); tick.setAttribute('y', H - marginB + 14);
        tick.setAttribute('text-anchor', 'middle'); tick.setAttribute('class', 'tick-label');
        tick.textContent = key;
        svg.appendChild(tick);
      }
    });

    const axisLabel = document.createElementNS(svgNS, 'text');
    axisLabel.setAttribute('x', marginL); axisLabel.setAttribute('y', 10);
    axisLabel.setAttribute('class', 'axis-label');
    axisLabel.textContent = 'Games/month (bar color = win rate that month)';
    svg.appendChild(axisLabel);
  }

  const sortState = {};
  function renderBreakdownTable(tableId, matches, keyFn) {
    const groups = {};
    matches.forEach(m => {
      const key = keyFn(m);
      if (!key) return;
      if (!groups[key]) groups[key] = { games: 0, wins: 0 };
      groups[key].games++;
      if (m.won) groups[key].wins++;
    });
    const total = matches.length;
    const rows = Object.entries(groups).map(([name, d]) => ({
      name, games: d.games, wins: d.wins, wr: d.wins / d.games, pickRate: d.games / total,
    }));

    const descEl = document.getElementById(tableId === 'civ-table' ? 'civ-desc' : 'map-desc');
    const noun = tableId === 'civ-table' ? 'civs' : 'maps';
    if (descEl) {
      const coveredGames = rows.reduce((s, r) => s + r.games, 0);
      descEl.dataset.baseText = descEl.dataset.baseText || descEl.textContent;
      descEl.textContent = `${descEl.dataset.baseText} (${rows.length} ${noun}, ${coveredGames.toLocaleString()} games)`;
    }

    if (!sortState[tableId]) sortState[tableId] = { key: 'games', dir: 'desc' };

    function draw() {
      const sort = sortState[tableId];
      const sorted = rows.slice().sort((a, b) => {
        const av = sort.key === 'name' ? a.name : a[sort.key];
        const bv = sort.key === 'name' ? b.name : b[sort.key];
        const cmp = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
        return sort.dir === 'asc' ? cmp : -cmp;
      });
      const cols = [
        { key: 'name', label: tableId === 'civ-table' ? 'Civ' : 'Map' },
        { key: 'games', label: 'Games', num: true },
        { key: 'wr', label: 'Win Rate', num: true },
        { key: 'pickRate', label: 'Pick Rate', num: true },
      ];
      const tableEl = document.getElementById(tableId);
      const thead = '<thead><tr>' + cols.map(c => {
        const sorted = sort.key === c.key;
        const cls = [c.num ? 'num' : '', sorted ? 'sorted' + (sort.dir === 'asc' ? ' asc' : '') : ''].filter(Boolean).join(' ');
        return `<th class="${cls}" data-key="${c.key}">${c.label}</th>`;
      }).join('') + '</tr></thead>';
      const tbody = '<tbody>' + sorted.map(r => {
        const wrCls = r.wr >= 0.52 ? 'wr-good' : r.wr <= 0.48 ? 'wr-bad' : '';
        return `<tr><td>${r.name}</td><td class="num">${r.games}</td><td class="num ${wrCls}">${(r.wr * 100).toFixed(1)}%</td><td class="num">${(r.pickRate * 100).toFixed(1)}%</td></tr>`;
      }).join('') + '</tbody>';
      tableEl.innerHTML = thead + tbody;
      tableEl.querySelectorAll('th[data-key]').forEach(th => {
        th.addEventListener('click', () => {
          const key = th.dataset.key;
          if (sort.key === key) sort.dir = sort.dir === 'asc' ? 'desc' : 'asc';
          else sortState[tableId] = { key, dir: key === 'name' ? 'asc' : 'desc' };
          draw();
        });
      });
    }
    draw();
  }

  renderLadder(activeLadder);
}

loadAndRender();
</script>

</html>
